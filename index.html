<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Откуда странице можно брать скрипты, стили и куда ходить в сеть. Новый адрес API добавлять в connect-src.
       file: — для index.html, открытого с диска: не все браузеры считают соседние файлы «своими» ('self'). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' file: data: blob:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self' https://api.github.com https://*.githubusercontent.com https://api.anthropic.com https://api.deepseek.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Семестр</title>
  <meta name="description" content="Учебный дашборд студента Кировского ГМУ: расписание группы, файлы по дисциплинам, отработки, дедлайны и уведомления.">
  <meta name="theme-color" content="#F5F3EC">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23C96442' stroke-width='1.4' opacity='.5'/%3E%3Ccircle cx='12' cy='12' r='4.4' fill='%23C96442'/%3E%3Ccircle cx='21' cy='12' r='2.2' fill='%23C96442'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Семестр">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/boot.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Навигация"></aside>
    <div class="scrim" data-action="close-sidebar"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Открыть меню">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="grow"></div>
        <span class="net-pill" id="net-pill" title="Нет интернета — работаем с сохранёнными данными" hidden>Офлайн</span>
        <button class="icon-btn theme-btn" id="theme-btn" data-action="theme-toggle" aria-label="Сменить тему"></button>
        <button class="icon-btn bell" id="bell-btn" data-action="bell" aria-label="Уведомления" aria-haspopup="dialog" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10.2 20a2 2 0 0 0 3.6 0"/></svg>
          <span class="bell-dot" hidden></span>
        </button>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Разделы"><span class="tab-thumb" aria-hidden="true"></span><div class="tabbar-items" id="tabbar-items"></div></nav>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-box">
      <span class="dropzone-ico">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4.5M7 9.5l5-5 5 5M5 20h14"/></svg>
      </span>
      <div class="drop-title">Отпустите, чтобы добавить</div>
      <div class="drop-sub" id="drop-sub">Сохраним в раздел «Файлы»</div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <input type="file" id="file-input" multiple hidden>

  <script src="js/utils.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/data/kgmu-3-lech-2026.js"></script>
  <script src="js/data/kgmu-topics.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/kgmu.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/files.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/home.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
